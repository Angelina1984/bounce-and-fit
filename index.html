<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bounce &amp; Fit — prototype</title>
    <!-- Fredoka: a rounded display face. The single biggest visual tell of a
         prototype was Phaser's default monospace fallback in every text
         object — no casual game ships monospace UI. main.ts waits on
         document.fonts.ready before booting so Phaser doesn't measure and
         cache text at the fallback metrics. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* Mirrors ui/textures.ts's backdrop gradient so the canvas blends
           into the page instead of showing a visible rectangle where the
           letterbox begins. Keep the two in sync by hand — same caveat as
           BACKGROUND_COLOR, there is no build step sharing them. */
        background: linear-gradient(#3d2075 0%, #2a1454 55%, #1c0d3a 100%);
        background-attachment: fixed;
        height: 100%;
        overflow: hidden;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
